set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# set -ga terminal-overrides ",screen-256color*:Tc"
# set-option -g default-terminal "screen-256color"
set-option -g default-shell /usr/bin/fish

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g focus-events on

bind -r m resize-pane -Z

set -g mouse on

set-option -g status-interval 1
# set-window-option -g mode-keys vi
#
# bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
# bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

set -s set-clipboard on

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "tmux-plugins/tmux-resurrect"
# set -g @plugin "tmux-plugins/tmux-yank"
# set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect
set -g @resurrect-strategy-nvim 'session'

# Previous status bar attempts:
# set -g status-style 'bg=#08273A fg=#fafafa'
# set -g status-style 'bg=#333333 fg=#5eacd3'
# set -g status-style 'bg=#282C3D fg=#84ABF4'
# set -g status-style 'bg=#719cd6 fg=#000000'

# Status bar — palette bridging Rose Pine + COOLNIGHT + Hyprland accents
# bg: deep indigo (between rose-pine surface #1f1d2e and coolnight navy #010c18)
# fg: rose-pine subtle (muted lavender for inactive text)
set -g status-style 'bg=#363354 fg=#908caa'

# Left: session name with a soft cyan pill
set -g status-left '#[bg=#26233a fg=#908caa] #S #[bg=#363354 fg=#26233a]'
set -g status-left-length 30

# Right: host + time in muted tones
set -g status-right '#[fg=#908caa] %H:%M  #h #[default]'
set -g status-right-length 40

# Active window: neon mint accent (echoes hyprland border #00ff99 / waybar cn_green)
set -g window-status-current-style 'bg=#363354 fg=#39ff9d bold'
set -g window-status-current-format ' #I #W '

# Inactive windows: dim lavender
set -g window-status-style 'bg=#363354 fg=#908caa'
set -g window-status-format ' #I #W '

# Pane borders: subtle, matching rose-pine muted
set -g pane-border-style 'fg=#26233a'
set -g pane-active-border-style 'fg=#388eff'

# set -s set-clipboard external

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
